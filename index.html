<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Tapan Kaikki 4 — Web</title>
    <link rel="icon" type="image/x-icon" href="./assets/tk.ico" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #screen {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      /* Boot overlay: covers the canvas until the first frame is ready. Shown by
         index.html, hidden/removed by main.ts (docs/web-port-architecture.md). */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 18px;
        align-items: center;
        justify-content: center;
        background: #000;
        color: #8fa0b3;
        font:
          14px/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        text-align: center;
        transition: opacity 0.25s ease;
      }
      #boot.boot--done {
        opacity: 0;
        pointer-events: none;
      }
      #boot.boot--error {
        color: #f66;
      }
      #boot-title {
        color: #cfd8e3;
        font-size: 18px;
        letter-spacing: 0.08em;
      }
      #boot-bar {
        width: 240px;
        height: 4px;
        background: #1a1f27;
        overflow: hidden;
      }
      #boot-bar > i {
        display: block;
        width: 40%;
        height: 100%;
        background: #4a90d9;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      #boot-status {
        max-width: 80vw;
        white-space: pre-wrap;
      }
      #boot-retry {
        display: none;
        padding: 6px 14px;
        border: 1px solid #4a5568;
        background: #161b22;
        color: #cfd8e3;
        font: inherit;
        cursor: pointer;
      }
      #boot.boot--error #boot-bar {
        display: none;
      }
      #boot.boot--error #boot-retry {
        display: inline-block;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-bar > i {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <div id="boot-title">Tapan Kaikki 4</div>
      <div id="boot-bar"><i></i></div>
      <div id="boot-status">Loading…</div>
      <button id="boot-retry" type="button" onclick="location.reload()">Reload</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
